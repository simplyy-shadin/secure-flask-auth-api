name: API Security Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-flask-secret-key-that-is-long-enough-2026
      JWT_SECRET_KEY: ci-jwt-secret-key-that-is-different-and-long-2026
      MFA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DATABASE_URL: sqlite:///migration-test.db

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Validate database migration
        run: flask --app app.py db upgrade

      - name: Run authentication and API security tests
        run: pytest --cov=secure_api --cov-report=term-missing --cov-fail-under=85
